<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>مدرسة المنيعي – الموهوبات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4fb;--ink:#2b1a4a;--p:#ff4fa3;--o:#ff9f1c;--t:#12c2b0;--b:#4d7cff;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1233;--ink:#fff1fb;--card:#2b1d4d}}
:root[data-theme=dark]{--bg:#1c1233;--ink:#fff1fb;--card:#2b1d4d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;min-height:100vh}
header{text-align:center;padding:18px 12px;background:linear-gradient(120deg,var(--p),var(--o),var(--t),var(--b));color:#fff}
#logo{width:92px;height:92px;border:3px dashed #fff;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:12px;cursor:pointer;overflow:hidden;background:#ffffff33}
#logo img{width:100%;height:100%;object-fit:cover}
.motto{font-size:clamp(26px,6vw,46px);font-weight:900;margin:4px 0}
header small{font-size:15px}.by{display:inline-block;margin-top:8px;padding:6px 20px;border-radius:30px;background:#ffffff33;border:2px solid #fff;font-size:20px;font-weight:900}
main{max-width:1280px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;perspective:900px}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--c,var(--p)),color-mix(in srgb,var(--c,var(--p)) 55%,#000));color:#fff;border-radius:22px;padding:16px;border:2px solid #ffffff66;box-shadow:0 1px 0 #fff6 inset,0 6px 0 color-mix(in srgb,var(--c,var(--p)) 45%,#000),0 14px 22px #0004;transition:transform .15s;transform-style:preserve-3d;cursor:pointer}
.card h3{margin:0 0 6px;color:#fff;text-shadow:0 2px 3px #0005}.card input,.card select{color:#2b1a4a;background:#fff}.card label{font-weight:700}.card:active{box-shadow:0 2px 0 color-mix(in srgb,var(--c,var(--p)) 45%,#000),0 6px 10px #0004}
.rip{position:absolute;border-radius:50%;background:#ffffffaa;transform:scale(0);animation:rip .7s ease-out forwards;pointer-events:none}@keyframes rip{to{transform:scale(4);opacity:0}}
.btn{border:0;border-radius:14px;padding:10px 16px;font:700 15px Cairo;background:var(--p);color:#fff;cursor:pointer;margin:3px}
.btn.o{background:var(--o)}.btn.t{background:var(--t)}.btn.b{background:var(--b)}.btn.g{background:#888}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid var(--b);outline-offset:2px}
input,select,textarea{width:100%;padding:10px;margin:4px 0 10px;border-radius:12px;border:2px solid #c9b5ee;font:15px Cairo;background:var(--card);color:var(--ink)}
.panel{background:var(--card);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 14px #0002}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ex{border-right:6px solid var(--t);padding:8px 12px;margin:8px 0;background:#12c2b012;border-radius:10px}
.opt{display:block;width:100%;text-align:right;margin:5px 0;padding:10px;border-radius:12px;border:2px solid #c9b5ee;background:var(--card);color:var(--ink);font:15px Cairo;cursor:pointer}
.opt.ok{background:#b8f2c8;color:#064}.opt.no{background:#ffc2c2;color:#800}
table{width:100%;border-collapse:collapse}td,th{border:1px solid #c9b5ee;padding:6px;text-align:right}th{background:var(--p);color:#fff}
.tbl{overflow-x:auto}
.cert{border:10px double var(--o);padding:24px;text-align:center;background:#fffbe8;color:#2b1a4a;border-radius:14px}
.cert h2{font-size:32px;margin:6px;color:var(--p)}.cert b{font-size:28px;color:var(--b)}
.hide{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.rip{animation:none;display:none}}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}@media(max-width:950px){.cols{grid-template-columns:1fr}}
.col{background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:#fff;border-radius:22px;padding:16px;border:2px solid #ffffff66;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,#000),0 14px 22px #0004;font-size:21px;line-height:1.7}
.col h3{font-size:26px;margin:0 0 10px;text-shadow:0 2px 3px #0005}.col .ex{background:#ffffff2e;border-right:6px solid #fff}.col .opt{font-size:20px;background:#fff;color:#2b1a4a;border-color:#fff}.col .opt.ok{background:#b8f2c8;color:#064}.col .opt.no{background:#ffc2c2;color:#800}
.col .btn{font-size:18px}.ans{display:inline-block;background:#fff;color:#2b1a4a;border-radius:10px;padding:2px 10px;margin:4px 0;font-size:22px}.ans.hide{display:none}.lt{font-size:32px;text-align:center}#res{font-size:20px}
.col summary{font-size:26px;font-weight:900;cursor:pointer;text-shadow:0 2px 3px #0005;list-style:none;display:flex;justify-content:space-between}.col summary::-webkit-details-marker{display:none}.col summary::after{content:'▾';transition:transform .2s}.col[open] summary::after{transform:rotate(180deg)}.col[open] summary{margin-bottom:10px}.col summary:focus-visible{outline:3px solid #fff;outline-offset:4px}
.col summary{font-size:26px;font-weight:900;cursor:pointer;list-style:none;text-shadow:0 2px 3px #0005;display:flex;justify-content:space-between;align-items:center;gap:8px}
.col summary::-webkit-details-marker{display:none}.col summary::after{content:"▼";font-size:18px;transition:transform .2s}.col[open] summary::after{transform:rotate(180deg)}.col[open] summary{margin-bottom:10px}
.col summary:focus-visible{outline:3px solid #fff;outline-offset:4px}
.cred{display:inline-block;margin-top:10px;padding:6px 26px;border-radius:30px;background:#2b1a4a;color:#ffe066;font-size:clamp(22px,4.5vw,32px);font-weight:900;box-shadow:0 4px 0 #0005}
.cred2{margin-top:8px;font-size:clamp(18px,3.5vw,24px);font-weight:900;text-shadow:0 2px 3px #0006}
.hz{grid-template-columns:1fr 1fr}.frow{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media(max-width:700px){.hz{grid-template-columns:1fr}.frow{grid-template-columns:1fr}}
.cert{page-break-inside:avoid}.rep td{font-size:14px}
.topbar{background:#fff;text-align:center;padding:6px 8px;border-bottom:4px solid var(--p)}.topbar img{max-width:100%;height:auto;max-height:120px}
.sch{display:inline-block;margin-top:8px;padding:6px 24px;border-radius:30px;background:#fff;color:#c2185b;font-size:clamp(24px,5.5vw,42px);font-weight:900;box-shadow:0 4px 0 #0005}
</style></head><body>

function tilt(root){root.querySelectorAll(".card").forEach(c=>{c.onmousemove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${x*-14}deg) rotateX(${y*14}deg)`};c.onmouseleave=()=>c.style.transform="";c.addEventListener('pointerdown',e=>{if(e.target.matches('input,select,button'))return;const r=c.getBoundingClientRect(),d=Math.max(r.width,r.height)/2,p=document.createElement('span');p.className='rip';p.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;c.appendChild(p);setTimeout(()=>p.remove(),700)})})}

function dash(){if(!teacher){gate();return}
 view="dash";
 app.innerHTML=nav()+`<div class="panel"><h2>لوحة المعلمة – ${TEACHER}</h2><p>الطالبات المسجلات: <b>${S.length}</b> (يتحدّث العدد عند الدخول).</p>
 <div class="row"><div><label>اسم الطالبة</label><input id="an"></div><div class="row"><div><label>الصف</label><select id="ag">${[5,6,7,8,9,10,11,12].map(g=>`<option>${g}</option>`).join("")}</select></div><div><label>الشعبة</label><input id="as"></div></div></div>
 <button class="btn" onclick="addS()">إضافة الطالبة</button><div><small>تُحفظ القائمة تلقائياً على الخادم، وتستطيع الطالبات الدخول فور إضافتهن.</small></div><hr>
 <button class="btn t" onclick="xl()">تصدير Excel</button><button class="btn o" onclick="dlf('students.csv',new Blob(['\\ufeff'+csv()],{type:'text/csv'}))">تصدير CSV</button><button class="btn" onclick="refresh()">تحديث</button>
 <div class="tbl"><table><tr><th>الاسم</th><th>الصف</th><th>الشعبة</th><th>الموهبة</th><th>المصدر</th><th>الدروس المنجزة</th><th>الخطة</th><th>حذف</th></tr>${S.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.grade}</td><td>${esc(s.sec)}</td>
 <td><select onchange="upd('${s.id}','talent',this.value)"><option value="">—</option>${TL.map(x=>`<option ${s.talent==x?"selected":""}>${x}</option>`).join("")}</select></td>
 <td><select onchange="upd('${s.id}','src',this.value)"><option value="">—</option>${SRC.map(x=>`<option ${s.src==x?"selected":""}>${x}</option>`).join("")}</select></td>
 <td>${s.done.length}</td><td><button class="btn b" onclick="word('${s.id}')">Word</button></td><td><button class="btn g" onclick="delS('${s.id}')">حذف</button></td></tr>`).join("")}</table></div>
 <h3>تقرير دخول الطالبات ونتائجهن</h3><div class="tbl"><table class="rep"><tr><th>الطالبة</th><th>الصف</th><th>مرات الدخول</th><th>آخر دخول</th><th>الدروس المرسلة إلى المعلمة</th></tr>${S.map(s=>{const L=s.logins||[];return `<tr><td>${esc(s.name)}</td><td>${s.grade}</td><td>${L.length}</td><td>${L.length?new Date(Math.max(...L)).toLocaleString("ar-AE"):"—"}</td><td>${esc((s.res||[]).filter(x=>x.sent).map(x=>x.t+" ("+x.sc+"/"+x.n+")").join("، "))||"—"}</td></tr>`}).join("")}</table></div>
 <p><small>الخطط تُنشأ منفصلة: الصف السابع بمحتوى السابع، والثامن بمحتوى الثامن.</small></p></div>`;
}
async function addS(){const n=$("#an").value.trim();if(!n){alert("اكتبي اسم الطالبة");return}
 try{await api("students",{method:"POST",body:JSON.stringify({name:n,grade:+$("#ag").value,sec:$("#as").value.trim()})});await load();dash()}
 catch(e){alert(e.status==409?"الطالبة مسجلة مسبقاً":"تعذر الإضافة")}}
async function delS(id){if(!confirm("حذف الطالبة؟"))return;try{await api("students?id="+encodeURIComponent(id),{method:"DELETE"});await load();dash()}catch(e){alert("تعذر الحذف")}}

async function refresh(){await load();dash()}
async function upd(id,k,v){const s=S.find(x=>x.id==id);s[k]=v;try{await api("students",{method:"PUT",body:JSON.stringify({id,[k]:v})})}catch(e){alert("تعذر الحفظ")}}
function csv(){return "الاسم,الصف,الشعبة,الموهبة,المصدر,دروس منجزة\n"+S.map(s=>[s.name,s.grade,s.sec,s.talent,s.src,s.done.length].map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n")}
function xl(){const rows=[["الاسم","الصف","الشعبة","نوع الموهبة","مصدر الاكتشاف","دروس منجزة"],...S.map(s=>[s.name,s.grade,s.sec,s.talent,s.src,s.done.length])];
 const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);ws["!views"]=[{RTL:true}];XLSX.utils.book_append_sheet(wb,ws,"الطالبات");
 dlf("students.xlsx",new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})]))}
async function word(id){
 const s=S.find(x=>x.id==id);if(!s.talent){alert("حدّدي نوع الموهبة أولاً");return}
 const g=s.grade>=8?8:7,L=g==8?G8:G7,done=s.done.map(x=>x.split("|")[1]),rest=L.filter(t=>!done.includes(t)&&C[g+"|"+t]),goals=["تنمية قدرات الطالبة في الرياضيات","تعزيز التفكير المنطقي والتحليل والاستنتاج","حل المشكلات الرياضية بطرق إبداعية","تطبيق مهارة «"+s.talent+"» في موضوعات الصف "+(g==8?"الثامن":"السابع")];
 const rows=[["اسم المعلمة",TEACHER],["اسم الطالبة",s.name],["الصف والشعبة",s.grade+" / "+s.sec],["المادة","الرياضيات"],["نوع الموهبة",s.talent],["عنوان البرنامج الإثرائي",PROG],["مصدر اكتشاف الموهبة",s.src||"ملاحظة المعلمة ونتائج التحصيل"],["الهدف العام",GOAL],["الأهداف الفرعية",goals.map((x,i)=>(i+1)+". "+x).join("\n")],["الإجراءات المقترحة",PROC[s.talent]+"\nموضوعات مقترحة: "+(rest.slice(0,3).join("، ")||"مراجعة الموضوعات المنجزة")],["أساليب التقويم",EVAL]];
 const x=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
 const p=(t,b)=>String(t).split("\n").map(l=>`<w:p><w:pPr><w:bidi/></w:pPr><w:r><w:rPr>${b?"<w:b/>":""}<w:rtl/></w:rPr><w:t xml:space="preserve">${x(l)}</w:t></w:r></w:p>`).join("");
 const bd=["top","left","bottom","right","insideH","insideV"].map(e=>`<w:${e} w:val="single" w:sz="4" w:color="888888"/>`).join("");
 const tb=`<w:tbl><w:tblPr><w:bidiVisual/><w:tblW w:w="9000" w:type="dxa"/><w:tblBorders>${bd}</w:tblBorders></w:tblPr>`+rows.map(r=>`<w:tr><w:tc><w:tcPr><w:tcW w:w="2600" w:type="dxa"/><w:shd w:fill="FFD6EC"/></w:tcPr>${p(r[0],1)}</w:tc><w:tc><w:tcPr><w:tcW w:w="6400" w:type="dxa"/></w:tcPr>${p(r[1])}</w:tc></w:tr>`).join("")+"</w:tbl>";
 const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${p("مدرسة المنيعي – خطة إثرائية للطالبة الموهوبة",1)}${p("بالميثاق نبلغ الآفاق",1)}${tb}<w:sectPr><w:bidi/></w:sectPr></w:body></w:document>`;
 const z=new JSZip();
 z.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
 z.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
 z.file("word/document.xml",doc);
 dlf("plan-"+s.name+"-grade"+g+".docx",await z.generateAsync({type:"blob"}));
}
init();
</script></body></html>
